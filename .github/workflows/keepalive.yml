name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Bisa di-trigger manual dari GitHub UI

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping iPos API & Supabase
        run: |
          curl -s -f "https://ipos-web.vercel.app/api/ping" || echo "Ping failed"
